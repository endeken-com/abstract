# Republishes the appcast from the gh-pages branch, e.g. after reverting a bad entry there:
#   git switch gh-pages && git revert <commit> && git push, then run this workflow.
name: Deploy appcast

on:
  workflow_dispatch:

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}appcast.xml
    steps:
      - uses: actions/checkout@v7
        with:
          ref: gh-pages

      - uses: actions/upload-pages-artifact@v5
        with:
          path: .

      - id: deploy
        uses: actions/deploy-pages@v5
