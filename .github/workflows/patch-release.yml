# Publishes the fixes cherry-picked onto a release branch: tags vX.Y.(n+1) at its head.
name: Patch release

on:
  workflow_dispatch:
    inputs:
      branch:
        description: Release branch, e.g. v0.9.x
        type: string
        required: true
      notes:
        description: Written notes shown above the generated list (optional)
        type: string
        default: ""

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write
  checks: read
  pages: write
  id-token: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.patch.outputs.sha }}
      version: ${{ steps.patch.outputs.version }}
      build: ${{ steps.patch.outputs.build }}
      tag: ${{ steps.patch.outputs.tag }}
      previous-tag: ${{ steps.patch.outputs.previous-tag }}
    steps:
      - name: Run from main only
        if: github.ref != 'refs/heads/main'
        run: |
          echo "::error::Run Patch release from main and pick the release branch in its input"
          exit 1

      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.branch }}
          fetch-depth: 0

      - id: patch
        env:
          BRANCH: ${{ inputs.branch }}
          GH_TOKEN: ${{ github.token }}
        run: |
          OUT=$(scripts/next-version.sh patch "$BRANCH")
          read -r VERSION BUILD <<< "$OUT"
          TAG=v$VERSION
          SHA=$(git rev-parse HEAD)
          scripts/require-tested.sh "$SHA"
          PREVIOUS=$(scripts/next-version.sh previous "$VERSION")
          gh api "repos/$GITHUB_REPOSITORY/git/refs" -f ref="refs/tags/$TAG" -f sha="$SHA" >/dev/null
          {
            echo "sha=$SHA"
            echo "version=$VERSION"
            echo "build=$BUILD"
            echo "tag=$TAG"
            echo "previous-tag=$PREVIOUS"
          } >> "$GITHUB_OUTPUT"
          echo "Tagged $TAG on $BRANCH at $(git log -1 --format='%h %s')" >> "$GITHUB_STEP_SUMMARY"

  build:
    needs: prepare
    uses: ./.github/workflows/build.yml
    secrets: inherit
    with:
      ref: ${{ needs.prepare.outputs.sha }}
      version: ${{ needs.prepare.outputs.version }}
      build: ${{ needs.prepare.outputs.build }}
      channel: stable
      tag: ${{ needs.prepare.outputs.tag }}
      previous-tag: ${{ needs.prepare.outputs.previous-tag }}
      notes: ${{ inputs.notes }}
