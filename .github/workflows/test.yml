# Checks every pull request into main or a release branch, and every push to them
# (the release workflows only ship commits whose `test` check passed).
name: Test

on:
  pull_request:
    branches: [main, "v*.x"]
  push:
    branches: [main, "v*.x"]

permissions:
  contents: read

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v7

      - name: Install tools
        run: brew install xcodegen actionlint

      - name: Lint workflows
        run: actionlint -shellcheck=

      - name: Script tests
        run: |
          sh scripts/tests/next-version-test.sh
          sh scripts/tests/notarize-test.sh
          python3 -m unittest discover -s scripts/tests -v

      - name: AbstractCore tests
        working-directory: Packages/AbstractCore
        run: swift test

      - uses: actions/cache/restore@v4
        id: iroh-cache
        with:
          path: Packages/Iroh/Iroh.xcframework
          key: iroh-apple-${{ hashFiles('scripts/prepare-iroh.sh') }}
      - name: Prepare internet transport
        run: scripts/prepare-iroh.sh apple
      - uses: actions/cache/save@v4
        if: steps.iroh-cache.outputs.cache-hit != 'true'
        with:
          path: Packages/Iroh/Iroh.xcframework
          key: ${{ steps.iroh-cache.outputs.cache-primary-key }}

      - name: Build the app
        run: |
          xcodegen generate
          scripts/build-app.sh
      - uses: actions/upload-artifact@v4
        if: github.event_name == 'pull_request'
        with:
          name: iroh-apple-xcframework
          path: Packages/Iroh/Iroh.xcframework
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 1

  mobile-changes:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.paths.outputs.changed }}
    steps:
      - uses: actions/checkout@v4
      - id: paths
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          git fetch --no-tags --depth=1 origin "$BASE_SHA"
          if git diff --quiet "$BASE_SHA" HEAD -- \
            mobile/ Packages/AbstractInternet/ Packages/Iroh/ scripts/prepare-iroh.sh \
            .github/workflows/mobile.yml .github/workflows/test.yml \
            Packages/AbstractCore/Sources/AbstractCore/Remote/ Abstract/Features/Remote/; then
            echo 'changed=false' >> "$GITHUB_OUTPUT"
          else
            echo 'changed=true' >> "$GITHUB_OUTPUT"
          fi

  ios-check:
    needs: [test, mobile-changes]
    if: needs.mobile-changes.outputs.changed == 'true'
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - uses: actions/download-artifact@v4
        with:
          name: iroh-apple-xcframework
          path: Packages/Iroh/Iroh.xcframework
      - run: test -f Packages/Iroh/Iroh.xcframework/.abstract-native-v1
      - run: npm ci
        working-directory: mobile
      - run: pod install
        working-directory: mobile/ios
      - run: xcodebuild -workspace Abstract.xcworkspace -scheme Abstract -configuration Debug -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' CODE_SIGNING_ALLOWED=NO build
        working-directory: mobile/ios
