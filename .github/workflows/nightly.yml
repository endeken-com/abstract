# Builds main every day when it changed since the last nightly, for the Nightly update channel.
# Scheduled workflows stop after 60 days without repository activity; re-enable them in Actions.
name: Nightly

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:
    inputs:
      force:
        description: Build even if main hasn't changed since the last nightly
        type: boolean
        default: false

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      skip: ${{ steps.nightly.outputs.skip }}
      sha: ${{ steps.nightly.outputs.sha }}
      version: ${{ steps.nightly.outputs.version }}
      build: ${{ steps.nightly.outputs.build }}
      previous-tag: ${{ steps.nightly.outputs.previous-tag }}
    steps:
      - name: Run from main only
        if: github.ref != 'refs/heads/main'
        run: |
          echo "::error::Run Nightly from main"
          exit 1

      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - id: nightly
        env:
          FORCE: ${{ inputs.force }}
        run: |
          LAST=$(git rev-parse -q --verify "refs/tags/nightly^{commit}" || true)
          if [ "$FORCE" != true ] && [ "$LAST" = "$GITHUB_SHA" ]; then
            echo "main hasn't changed since the last nightly." >> "$GITHUB_STEP_SUMMARY"
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          OUT=$(scripts/next-version.sh nightly "$GITHUB_RUN_NUMBER")
          read -r VERSION BUILD <<< "$OUT"
          LATEST=$(scripts/next-version.sh latest)
          {
            echo "skip=false"
            echo "sha=$GITHUB_SHA"
            echo "version=$VERSION"
            echo "build=$BUILD"
            echo "previous-tag=${LATEST:+v$LATEST}"
          } >> "$GITHUB_OUTPUT"

  build:
    needs: prepare
    if: needs.prepare.outputs.skip != 'true'
    uses: ./.github/workflows/build.yml
    secrets: inherit
    with:
      ref: ${{ needs.prepare.outputs.sha }}
      version: ${{ needs.prepare.outputs.version }}
      build: ${{ needs.prepare.outputs.build }}
      channel: nightly
      tag: nightly
      previous-tag: ${{ needs.prepare.outputs.previous-tag }}
