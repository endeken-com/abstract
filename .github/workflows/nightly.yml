# Builds main daily after its tests pass, for the Nightly update channel.
# Scheduled workflows stop after 60 days without repository activity; re-enable them in Actions.
name: Nightly

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_run:
    workflows: [Test]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      force:
        description: Build even if main hasn't changed since the last nightly
        type: boolean
        default: false

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write
  checks: read
  pages: write
  id-token: write

jobs:
  prepare:
    if: >-
      github.event_name != 'workflow_run' ||
      (github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_branch == 'main' &&
       github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-latest
    outputs:
      skip: ${{ steps.nightly.outputs.skip }}
      sha: ${{ steps.nightly.outputs.sha }}
      version: ${{ steps.nightly.outputs.version }}
      build: ${{ steps.nightly.outputs.build }}
      previous-tag: ${{ steps.nightly.outputs.previous-tag }}
    steps:
      - name: Run from main only
        if: github.ref != 'refs/heads/main'
        run: |
          echo "::error::Run Nightly from main"
          exit 1

      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - id: nightly
        env:
          FORCE: ${{ inputs.force }}
          GH_TOKEN: ${{ github.token }}
          TESTED_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          skip() {
            echo "$1" >> "$GITHUB_STEP_SUMMARY"
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          }
          SHA=$(git rev-parse HEAD)
          if [ "$GITHUB_EVENT_NAME" = workflow_run ] && [ "$SHA" != "$TESTED_SHA" ]; then
            skip "main moved since tests passed on $TESTED_SHA; a newer test run will trigger Nightly."
          fi
          LAST=$(git rev-parse -q --verify "refs/tags/nightly^{commit}" || true)
          if [ "$FORCE" != true ] && [ "$LAST" = "$SHA" ]; then
            skip "main hasn't changed since the last nightly."
          fi
          if [ "$GITHUB_EVENT_NAME" = workflow_run ]; then
            if [ "$(date -u +%H)" -lt 6 ]; then
              skip "Nightly starts at 06:00 UTC."
            fi
            LAST_BUILD=$(gh release view nightly --json assets \
              --jq '[.assets[] | select(.name | endswith(".dmg")) | .createdAt] | max // ""' 2>/dev/null || true)
            if [ "${LAST_BUILD%%T*}" = "$(date -u +%F)" ]; then
              skip "A nightly was already built today."
            fi
          else
            STATE=$(gh api "repos/$GITHUB_REPOSITORY/commits/$SHA/check-runs?check_name=test" \
              --jq 'if .check_runs | length == 0 then "missing" else (.check_runs | max_by(.id).conclusion // "pending") end')
            if [ "$STATE" != success ]; then
              skip "The test check on $SHA is $STATE. No nightly build started."
            fi
          fi
          OUT=$(scripts/next-version.sh nightly "$GITHUB_RUN_NUMBER")
          read -r VERSION BUILD <<< "$OUT"
          LATEST=$(scripts/next-version.sh latest)
          {
            echo "skip=false"
            echo "sha=$SHA"
            echo "version=$VERSION"
            echo "build=$BUILD"
            echo "previous-tag=${LATEST:+v$LATEST}"
          } >> "$GITHUB_OUTPUT"

  build:
    needs: prepare
    if: needs.prepare.result == 'success' && needs.prepare.outputs.skip != 'true'
    uses: ./.github/workflows/build.yml
    secrets: inherit
    with:
      ref: ${{ needs.prepare.outputs.sha }}
      version: ${{ needs.prepare.outputs.version }}
      build: ${{ needs.prepare.outputs.build }}
      channel: nightly
      tag: nightly
      previous-tag: ${{ needs.prepare.outputs.previous-tag }}
