name: Abstract
options:
  bundleIdPrefix: sh.abstract
  deploymentTarget:
    macOS: "15.0"
  createIntermediateGroups: true
  developmentLanguage: en
settings:
  base:
    SWIFT_VERSION: "6.0"
    MACOSX_DEPLOYMENT_TARGET: "15.0"
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    DEAD_CODE_STRIPPING: YES
    # Local builds are dev builds (0.0.0, and their updater stays off). CI sets
    # both from git tags when it builds a release (scripts/next-version.sh).
    MARKETING_VERSION: "0.0.0"
    CURRENT_PROJECT_VERSION: "1"
packages:
  AbstractCore:
    path: Packages/AbstractCore
  Textual:
    path: Packages/Textual
  SwiftTerm:
    url: https://github.com/migueldeicaza/SwiftTerm
    # 1.12+ compiles Metal shaders, which needs Xcode's separate Metal
    # Toolchain download. 1.11.2 renders with Core Text and builds as-is.
    exactVersion: 1.11.2
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    # Keep in step with SPARKLE_VERSION in .github/workflows/build.yml.
    exactVersion: 2.10.0
targets:
  Abstract:
    type: application
    platform: macOS
    sources:
      - path: Abstract
    dependencies:
      - package: AbstractCore
      - package: Textual
      - package: SwiftTerm
      - package: Sparkle
    info:
      path: Abstract/Resources/Info.plist
      properties:
        CFBundleDisplayName: Abstract
        CFBundleName: Abstract
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        LSApplicationCategoryType: public.app-category.developer-tools
        LSMinimumSystemVersion: "15.0"
        NSHumanReadableCopyright: ""
        NSLocalNetworkUsageDescription: "Abstract finds your other Macs on this network so you can pair them and run agents on one from another."
        NSBonjourServices:
          - _abstract._tcp
        SUFeedURL: https://endeken-com.github.io/abstract/appcast.xml
        # Sparkle's EdDSA public key; the private half is the SPARKLE_ED_PRIVATE_KEY secret.
        SUPublicEDKey: "trJXw2M/8e15Dvh4dT8gFPtr4mTofkW/NVPXycB9658="
        # Check daily from first launch, without Sparkle's "may we check?" prompt.
        SUEnableAutomaticChecks: true
    entitlements:
      path: Abstract/Resources/Abstract.entitlements
      properties:
        # Abstract spawns agent CLIs and git in arbitrary repositories, which
        # the App Sandbox forbids. It ships unsandboxed, like a terminal.
        com.apple.security.app-sandbox: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: sh.abstract.app
        PRODUCT_NAME: Abstract
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        # Off for local (ad hoc) builds: the runtime's library validation refuses the
        # ad hoc Sparkle.framework, so the app wouldn't launch. scripts/sign-app.sh
        # turns it on when it signs a release with the Developer ID.
        ENABLE_HARDENED_RUNTIME: NO
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_IDENTITY: "-"
        SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
        SWIFT_APPROACHABLE_CONCURRENCY: YES
        GENERATE_INFOPLIST_FILE: NO
schemes:
  Abstract:
    build:
      targets:
        Abstract: all
    run:
      config: Debug
    test:
      config: Debug
