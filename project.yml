name: Abstract
options:
  bundleIdPrefix: sh.abstract
  deploymentTarget:
    macOS: "15.0"
  createIntermediateGroups: true
  developmentLanguage: en
settings:
  base:
    SWIFT_VERSION: "6.0"
    MACOSX_DEPLOYMENT_TARGET: "15.0"
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    DEAD_CODE_STRIPPING: YES
    # Local builds are dev builds (0.0.0, and their updater stays off). CI sets
    # both from git tags when it builds a release (scripts/next-version.sh).
    MARKETING_VERSION: "0.0.0"
    CURRENT_PROJECT_VERSION: "1"
packages:
  AbstractInternet:
    path: Packages/AbstractInternet
  AbstractCore:
    path: Packages/AbstractCore
  Textual:
    path: Packages/Textual
  SwiftTerm:
    url: https://github.com/migueldeicaza/SwiftTerm
    # 1.12+ compiles Metal shaders, which needs Xcode's separate Metal
    # Toolchain download. 1.11.2 renders with Core Text and builds as-is.
    exactVersion: 1.11.2
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    # Keep in step with SPARKLE_VERSION in .github/workflows/build.yml.
    exactVersion: 2.10.0
targets:
  Abstract:
    type: application
    platform: macOS
    sources:
      - path: Abstract
        # The app icon's source art; scripts/make-icons.sh makes AppIcon.icon from it.
        excludes:
          - Resources/Brand
          - Resources/Plugins
          - Resources/PluginKit
      # Bundled plugins keep their folder shape inside the app.
      - path: Abstract/Resources/Plugins
        type: folder
      # The design kit every plugin can link (ABS-134), served from the host's scheme.
      - path: Abstract/Resources/PluginKit
        type: folder
    dependencies:
      - package: AbstractCore
      - package: AbstractInternet
      - package: Textual
      - package: SwiftTerm
      - package: Sparkle
      # `abstract`, the command line, inside the app. Not Contents/MacOS: on a
      # case-insensitive disk it would be the app's own `Abstract`.
      - target: AbstractCLI
        embed: true
        codeSign: false
        copy:
          destination: wrapper
          subpath: Contents/Helpers
      # ABEL, the voice assistant (ABS-203): its own app with its own bundle
      # id and permissions, turned on and off with SMAppService.
      - target: Abel
        embed: true
        codeSign: true
        copy:
          destination: wrapper
          subpath: Contents/Library/LoginItems
    info:
      path: Abstract/Resources/Info.plist
      properties:
        CFBundleDisplayName: Abstract
        CFBundleName: Abstract
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        LSApplicationCategoryType: public.app-category.developer-tools
        LSMinimumSystemVersion: "15.0"
        NSHumanReadableCopyright: ""
        NSLocalNetworkUsageDescription: "Abstract finds your other Macs on this network so you can pair them and run agents on one from another."
        NSBonjourServices:
          - _abstract._tcp
        SUFeedURL: https://endeken-com.github.io/abstract/appcast.xml
        # Sparkle's EdDSA public key; the private half is the SPARKLE_ED_PRIVATE_KEY secret.
        SUPublicEDKey: "trJXw2M/8e15Dvh4dT8gFPtr4mTofkW/NVPXycB9658="
        # Check daily from first launch, without Sparkle's "may we check?" prompt.
        SUEnableAutomaticChecks: true
    entitlements:
      path: Abstract/Resources/Abstract.entitlements
      properties:
        # Abstract spawns agent CLIs and git in arbitrary repositories, which
        # the App Sandbox forbids. It ships unsandboxed, like a terminal.
        com.apple.security.app-sandbox: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: sh.abstract.app
        PRODUCT_NAME: Abstract
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        # Off for local (ad hoc) builds: the runtime's library validation refuses the
        # ad hoc Sparkle.framework, so the app wouldn't launch. scripts/sign-app.sh
        # turns it on when it signs a release with the Developer ID.
        ENABLE_HARDENED_RUNTIME: NO
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_IDENTITY: "-"
        SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
        SWIFT_APPROACHABLE_CONCURRENCY: YES
        GENERATE_INFOPLIST_FILE: NO
  Abel:
    type: application
    platform: macOS
    # SpeechAnalyzer, ABEL's on-device recognizer, is macOS 26 (ABS-202).
    deploymentTarget: "26.0"
    sources:
      - path: Abel
    dependencies:
      - package: AbstractCore
        product: AbstractCore
      - package: AbstractCore
        product: AbelKit
    info:
      path: Abel/Resources/Info.plist
      properties:
        CFBundleDisplayName: ABEL
        CFBundleName: Abel
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        LSMinimumSystemVersion: "26.0"
        # No Dock icon: ABEL lives in its floating panel and the menu bar.
        LSUIElement: true
        NSHumanReadableCopyright: ""
        NSMicrophoneUsageDescription: "ABEL listens while you hold ⌥Space, or for “Hey Abel” if you turn that on. What it hears is understood on this Mac and never sent anywhere or saved."
        NSSpeechRecognitionUsageDescription: "ABEL understands what you say on this Mac. Nothing is sent anywhere."
        NSAppleEventsUsageDescription: "ABEL controls apps you allow in Abstract's Settings › ABEL, after reading each action back to you."
    entitlements:
      path: Abel/Resources/Abel.entitlements
      properties:
        com.apple.security.app-sandbox: false
        com.apple.security.device.audio-input: true
        com.apple.security.automation.apple-events: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: sh.abstract.abel
        PRODUCT_NAME: Abel
        MACOSX_DEPLOYMENT_TARGET: "26.0"
        ENABLE_HARDENED_RUNTIME: NO
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_IDENTITY: "-"
        SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
        SWIFT_APPROACHABLE_CONCURRENCY: YES
        GENERATE_INFOPLIST_FILE: NO
  AbstractCLI:
    type: tool
    platform: macOS
    sources:
      - path: Packages/AbstractCore/Sources/AbstractCLI
    dependencies:
      - package: AbstractCore
    settings:
      base:
        PRODUCT_NAME: abstract
        PRODUCT_BUNDLE_IDENTIFIER: sh.abstract.cli
        ENABLE_HARDENED_RUNTIME: NO
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_IDENTITY: "-"
schemes:
  Abstract:
    build:
      targets:
        Abstract: all
    run:
      config: Debug
    test:
      config: Debug
