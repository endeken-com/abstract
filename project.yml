name: Backtick
options:
  bundleIdPrefix: sh.backtick
  deploymentTarget:
    macOS: "15.0"
  createIntermediateGroups: true
  developmentLanguage: en
settings:
  base:
    SWIFT_VERSION: "6.0"
    MACOSX_DEPLOYMENT_TARGET: "15.0"
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    DEAD_CODE_STRIPPING: YES
packages:
  BacktickCore:
    path: Packages/BacktickCore
  Textual:
    url: https://github.com/gonzalezreal/textual
    from: 0.1.0
targets:
  Backtick:
    type: application
    platform: macOS
    sources:
      - path: Backtick
    dependencies:
      - package: BacktickCore
      - package: Textual
    info:
      path: Backtick/Resources/Info.plist
      properties:
        CFBundleDisplayName: Backtick
        CFBundleShortVersionString: "0.2.0"
        CFBundleVersion: "1"
        LSApplicationCategoryType: public.app-category.developer-tools
        LSMinimumSystemVersion: "15.0"
        NSHumanReadableCopyright: ""
    entitlements:
      path: Backtick/Resources/Backtick.entitlements
      properties:
        # Backtick spawns agent CLIs and git in arbitrary repositories, which
        # the App Sandbox forbids. It ships unsandboxed, like a terminal.
        com.apple.security.app-sandbox: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: sh.backtick.app
        PRODUCT_NAME: Backtick
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ENABLE_HARDENED_RUNTIME: YES
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_IDENTITY: "-"
        SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
        SWIFT_APPROACHABLE_CONCURRENCY: YES
        GENERATE_INFOPLIST_FILE: NO
schemes:
  Backtick:
    build:
      targets:
        Backtick: all
    run:
      config: Debug
    test:
      config: Debug
