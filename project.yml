name: Abstract
options:
  bundleIdPrefix: sh.abstract
  deploymentTarget:
    macOS: "15.0"
  createIntermediateGroups: true
  developmentLanguage: en
settings:
  base:
    SWIFT_VERSION: "6.0"
    MACOSX_DEPLOYMENT_TARGET: "15.0"
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    DEAD_CODE_STRIPPING: YES
    # Overridden with the CI run number for release builds (scripts/package-dmg.sh).
    CURRENT_PROJECT_VERSION: "1"
packages:
  AbstractCore:
    path: Packages/AbstractCore
  Textual:
    path: Packages/Textual
  SwiftTerm:
    url: https://github.com/migueldeicaza/SwiftTerm
    # 1.12+ compiles Metal shaders, which needs Xcode's separate Metal
    # Toolchain download. 1.11.2 renders with Core Text and builds as-is.
    exactVersion: 1.11.2
targets:
  Abstract:
    type: application
    platform: macOS
    sources:
      - path: Abstract
    dependencies:
      - package: AbstractCore
      - package: Textual
      - package: SwiftTerm
    info:
      path: Abstract/Resources/Info.plist
      properties:
        CFBundleDisplayName: Abstract
        CFBundleName: Abstract
        CFBundleShortVersionString: "0.3.3"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        LSApplicationCategoryType: public.app-category.developer-tools
        LSMinimumSystemVersion: "15.0"
        NSHumanReadableCopyright: ""
        NSLocalNetworkUsageDescription: "Abstract finds your other Macs on this network so you can pair them and run agents on one from another."
        NSBonjourServices:
          - _abstract._tcp
    entitlements:
      path: Abstract/Resources/Abstract.entitlements
      properties:
        # Abstract spawns agent CLIs and git in arbitrary repositories, which
        # the App Sandbox forbids. It ships unsandboxed, like a terminal.
        com.apple.security.app-sandbox: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: sh.abstract.app
        PRODUCT_NAME: Abstract
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ENABLE_HARDENED_RUNTIME: YES
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_IDENTITY: "-"
        SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
        SWIFT_APPROACHABLE_CONCURRENCY: YES
        GENERATE_INFOPLIST_FILE: NO
schemes:
  Abstract:
    build:
      targets:
        Abstract: all
    run:
      config: Debug
    test:
      config: Debug
