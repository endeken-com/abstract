# Lightsail terminates public HTTPS and forwards HTTP privately to this port.
http_bind_addr = "127.0.0.1:8081"
enable_relay = true
enable_quic_addr_discovery = false
enable_metrics = false

# Only devices with a current signed registration can attach to the relay.
access.http.url = "http://127.0.0.1:8082/access"

# Bound each client's ingress to 1 MiB/s with room for a short burst.
# This is not a total bandwidth budget or a limit on the number of connections.
[limits.client.rx]
bytes_per_second = 1048576
max_burst_bytes = 2097152
