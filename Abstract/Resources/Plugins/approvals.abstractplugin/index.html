<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self' data:">
<link rel="stylesheet" href="style.css">
<title>Approvals</title>
</head>
<body>
<main>
  <header>
    <h1>Approvals</h1>
    <p id="summary" class="note"></p>
  </header>
  <p id="error" class="notice" hidden></p>
  <p id="empty" class="notice" hidden>Nothing is waiting for you. When an agent asks for permission or has a question, it shows up here.</p>
  <ul id="queue" aria-label="Waiting for you"></ul>
  <section id="answered-section" hidden>
    <h2>Answered here</h2>
    <ul id="answered"></ul>
  </section>
</main>
<script src="queue.js"></script>
<script src="app.js"></script>
</body>
</html>
